<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Udomkati 6th Anniversary · Business Table</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Kanit:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1E9BC9;--ink:#1a1209;--paper:#FFF3D0;--card:#FFFBEF;--y:#FFC72C;--r:#E8412B;--t:#1E9BC9;--muted:#6b5a3a;--onbg:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e5673;--paper:#f3e6bd;--card:#fff4d6}}
:root[data-theme="dark"]{--bg:#0e5673;--paper:#f3e6bd;--card:#fff4d6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:'Kanit',system-ui,sans-serif;color:var(--ink);background:var(--bg);
background-image:repeating-conic-gradient(from 0deg at 50% 0%,rgba(255,199,44,.22) 0 6deg,transparent 6deg 12deg),radial-gradient(rgba(0,0,0,.12) 1.2px,transparent 1.4px);background-size:100% 100%,10px 10px;background-attachment:fixed}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 80px}
.bang{font-family:'Bangers','Kanit',Impact,sans-serif;letter-spacing:.04em}
.hero{display:grid;grid-template-columns:1fr 170px;gap:16px;align-items:center;margin-bottom:18px}
.title{background:var(--y);border:4px solid var(--ink);box-shadow:7px 7px 0 var(--ink);padding:16px 18px;transform:rotate(-1deg)}
.title small{display:inline-block;background:var(--r);color:#fff;font-weight:700;padding:2px 10px;border:2px solid var(--ink);margin-bottom:6px}
.title h1{margin:0;font-size:clamp(34px,7vw,64px);line-height:.95;color:var(--r);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}
.title p{margin:8px 0 0;font-weight:500}
.poster{width:100%;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);transform:rotate(2deg);display:block}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.stat{background:var(--paper);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:6px 14px;font-weight:700}
.stat b{font-size:26px;color:var(--r);margin-right:6px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1;min-width:220px;border:3px solid var(--ink);background:#fff;padding:12px 14px;font:inherit;font-size:16px;box-shadow:4px 4px 0 var(--ink)}
.btn{font:inherit;font-weight:700;cursor:pointer;border:3px solid var(--ink);background:var(--r);color:#fff;padding:11px 18px;box-shadow:4px 4px 0 var(--ink);font-size:16px;text-decoration:none;display:inline-block}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:var(--paper);color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{font:inherit;font-weight:500;cursor:pointer;border:3px solid var(--ink);background:var(--paper);padding:6px 12px;color:var(--ink)}
.chip.on{background:var(--c,var(--ink));color:#fff;box-shadow:3px 3px 0 var(--ink)}
.chip i{font-style:normal;opacity:.7;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{background:var(--card);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:14px;display:flex;flex-direction:column;gap:8px;position:relative}
.card:before{content:"";position:absolute;inset:0 0 auto 0;height:10px;background:var(--c)}
.card h3{margin:10px 0 0;font-size:21px;line-height:1.15}
.tag{align-self:flex-start;background:var(--c);color:#fff;border:2px solid var(--ink);font-size:13px;padding:1px 9px;font-weight:700}
.biz{font-weight:500;color:var(--muted);margin:-4px 0 0}
.desc{margin:0;font-size:15px;line-height:1.4;word-break:break-word}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.mini{font:inherit;font-size:14px;font-weight:500;border:2px solid var(--ink);background:#fff;color:var(--ink);padding:4px 10px;cursor:pointer;text-decoration:none;word-break:break-all}
.mini.go{background:var(--y);font-weight:700}
.del{position:absolute;top:14px;right:10px;background:none;border:0;font-size:18px;cursor:pointer;color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;background:var(--paper);border:3px dashed var(--ink);padding:36px 16px;font-size:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:20}
.modal.open{display:flex}
.sheet{background:var(--paper);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);width:100%;max-width:520px;padding:18px;margin:auto}
.sheet h2{margin:0 0 10px;font-size:34px;color:var(--r);-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
label{display:block;font-weight:700;font-size:14px;margin:10px 0 3px}
input,select,textarea{width:100%;font:inherit;font-size:16px;border:3px solid var(--ink);padding:9px 10px;background:#fff;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}
.note{background:var(--y);border:3px solid var(--ink);padding:8px 12px;margin-bottom:12px;font-size:14px;display:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;font-weight:500;z-index:30;display:none}
footer{text-align:center;color:var(--onbg);margin-top:30px;font-weight:500}
@media(max-width:560px){.hero{grid-template-columns:1fr 110px}.two{grid-template-columns:1fr}}
</style></head><body>

 $("stats").innerHTML=`<div class="stat"><b class="bang">${cards.length}</b>ผู้ร่วมงาน</div>`+CATS.map(c=>`<div class="stat" style="background:${c.c};color:#fff"><b class="bang" style="color:#fff">${cards.filter(x=>x.cat===c.k).length}</b>${c.e}</div>`).join("");
 $("chips").innerHTML=`<button class="chip ${filter==="all"?"on":""}" data-k="all">ทั้งหมด<i>${cards.length}</i></button>`+CATS.map(c=>`<button class="chip ${filter===c.k?"on":""}" style="--c:${c.c}" data-k="${c.k}">${c.e} ${c.k}<i>${cards.filter(x=>x.cat===c.k).length}</i></button>`).join("");
 const list=cards.filter(x=>(filter==="all"||x.cat===filter)&&(!q||[x.name,x.biz,x.cat,x.desc,x.soc,x.line].join(" ").toLowerCase().includes(q)));
 $("grid").innerHTML=list.length?list.map(x=>{const c=cat(x.cat),l=url(x.link),s=socUrl(x.soc),mine=x.uid===uid||admin;
  return`<div class="card" style="--c:${c.c}">${mine?`<button class="del" data-del="${esc(x.id)}" title="ลบ">✕</button>`:""}
  <span class="tag">${c.e} ${esc(x.cat)}</span><h3>${esc(x.name)}</h3>${x.biz?`<p class="biz">${esc(x.biz)}</p>`:""}
  ${x.desc?`<p class="desc">${esc(x.desc)}</p>`:""}
  <div class="row">${l?`<a class="mini go" href="${esc(l)}" target="_blank" rel="noopener noreferrer">🔗 ดูผลงาน</a>`:""}
  ${x.tel?`<a class="mini" href="tel:${esc(x.tel.replace(/[^\d+]/g,""))}">📞 ${esc(x.tel)}</a>`:""}
  ${x.line?`<button class="mini" data-copy="${esc(x.line)}">LINE: ${esc(x.line)}</button>`:""}
  ${x.soc?(s?`<a class="mini" href="${esc(s)}" target="_blank" rel="noopener noreferrer">${esc(x.soc)}</a>`:`<button class="mini" data-copy="${esc(x.soc)}">${esc(x.soc)}</button>`):""}
  ${x.mail?`<a class="mini" href="mailto:${esc(x.mail)}">✉ ${esc(x.mail)}</a>`:""}</div></div>`}).join(""):`<div class="empty">ยังไม่มีข้อมูลในหมวดนี้ — เป็นคนแรกที่ฝากช่องทางติดต่อเลย! 🍺</div>`;
}
document.addEventListener("click",async e=>{
 const t=e.target.closest("[data-k],[data-copy],[data-del]");if(!t)return;
 if(t.dataset.k){filter=t.dataset.k;render()}
 else if(t.dataset.copy){try{await navigator.clipboard.writeText(t.dataset.copy);toast("คัดลอกแล้ว: "+t.dataset.copy)}catch{toast(t.dataset.copy)}}
 else if(t.dataset.del&&confirm("ลบข้อมูลนี้?")){
  if(local)cards=cards.filter(c=>c.id!==t.dataset.del),render();
  else try{await db.collection("cards").doc(t.dataset.del).delete()}catch{toast("ลบไม่ได้")}}
});
$("q").addEventListener("input",render);
const open=v=>$("modal").classList.toggle("open",v);
$("add").onclick=()=>open(true);$("cancel").onclick=()=>open(false);
$("save").onclick=async()=>{
 const g=i=>$(i).value.trim();
 if(!g("f_name"))return toast("กรุณาใส่ชื่อ");
 const d={name:g("f_name"),biz:g("f_biz"),cat:$("f_cat").value,tel:g("f_tel"),line:g("f_line"),soc:g("f_soc"),mail:g("f_mail"),link:g("f_link"),desc:g("f_desc"),uid:uid||"local",ts:Date.now()};
 if(!d.tel&&!d.line&&!d.soc&&!d.mail&&!d.link)return toast("ใส่ช่องทางติดต่ออย่างน้อย 1 อย่าง");
 try{
  if(local)cards.unshift({...d,id:"l"+Date.now()}),render();
  else await db.collection("cards").add(d);
  ["f_name","f_biz","f_tel","f_line","f_soc","f_mail","f_link","f_desc"].forEach(i=>$(i).value="");
  open(false);toast("บันทึกแล้ว ขอบคุณครับ 🎉");
 }catch(err){toast("บันทึกไม่ได้ — ตรวจสอบสิทธิ์การเข้าถึง")}
};
const H=["ts","name","biz","cat","tel","line","soc","mail","link","desc"];
const fmt=t=>t?new Date(t).toLocaleString("th-TH",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}):"";
const cell=(c,k)=>k==="ts"?fmt(c.ts):String(c[k]||"");
function snapHTML(){
 const data=JSON.stringify(cards).replace(/</g,"\\u003c");
 const html="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
 return html.replace("<script>",()=>"<script>window.__SNAP="+data+";window.__SNAPTS="+Date.now()+";<\/script><script>");
}
let fh=null,saveT=null;
const writeSnap=async()=>{if(!fh)return;try{const w=await fh.createWritable();await w.write(snapHTML());await w.close();$("auto").textContent="⚡ Auto-save ON · "+fmt(Date.now()).slice(-5)}catch{fh=null;$("auto").textContent="⚡ Auto-save";toast("Auto-save หยุดทำงาน — กดเปิดใหม่")}};
$("snap").onclick=async()=>{try{const d=await claude.use("downloads");if(!d)return toast("ดาวน์โหลดไม่รองรับ");await d.save({filename:"udomkati-business-table-"+new Date().toISOString().slice(0,10)+".html",data:snapHTML()})}catch{toast("ยกเลิก")}};
$("auto").onclick=async()=>{
 if(fh){fh=null;$("auto").textContent="⚡ Auto-save";return toast("ปิด Auto-save แล้ว")}
 if(!window.showSaveFilePicker)return toast("เบราว์เซอร์นี้ไม่รองรับ Auto-save — ใช้ Chrome/Edge บนคอมพิวเตอร์ หรือกด Export HTML");
 try{fh=await showSaveFilePicker({suggestedName:"udomkati-business-table.html",types:[{description:"HTML",accept:{"text/html":[".html"]}}]});await writeSnap();toast("เปิด Auto-save แล้ว — บันทึกทับไฟล์เดิมทุกครั้งที่มีข้อมูลใหม่")}catch(e){fh=null;toast(e&&e.name==="AbortError"?"ยกเลิก":"หน้านี้ไม่อนุญาตให้ Auto-save — ใช้ Export HTML แทน")}
};
$("copyall").onclick=async()=>{
 if(!cards.length)return toast("ยังไม่มีข้อมูล");
 const clean=s=>s.replace(/[\t\r\n]+/g," ");
 const tsv=H.map(k=>k==="ts"?"time":k).join("\t")+"\n"+cards.map(c=>H.map(k=>clean(cell(c,k))).join("\t")).join("\n");
 try{await navigator.clipboard.writeText(tsv)}catch{const a=document.createElement("textarea");a.value=tsv;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch{}a.remove()}
 toast("คัดลอก "+cards.length+" รายการแล้ว — วางใน Google Sheets ได้เลย (Ctrl/Cmd+V)");
};
$("csv").onclick=async()=>{
 const h=H;
 const csv="\ufeff"+h.map(k=>k==="ts"?"time":k).join(",")+"\n"+cards.map(c=>h.map(k=>'"'+cell(c,k).replace(/"/g,'""')+'"').join(",")).join("\n");
 try{const d=await claude.use("downloads");if(!d)return toast("ดาวน์โหลดไม่รองรับ");await d.save({filename:"udomkati-business-table.csv",data:csv})}catch{toast("ยกเลิก")}
};
(async()=>{
 if(window.__SNAP){cards=window.__SNAP;local=true;render();["add","copyall","csv","auto","snap"].forEach(i=>$(i).style.display="none");note("📁 สำเนาออฟไลน์ ณ "+fmt(window.__SNAPTS)+" — ค้นหา กรอง และกดลิงก์ได้ แต่เพิ่มข้อมูลไม่ได้");return}
 render();
 try{
  const c=window.claude?await claude.use("db"):null;
  if(!c)throw 0;
  db=c;const u=await claude.use("user");
  try{uid=u?await u.id():null;admin=u?await u.canEdit():false}catch{}
  let ok=false;setTimeout(()=>{if(!ok)note("กำลังโหลดข้อมูล… หากนานเกินไปให้รีเฟรชหน้า")},10000);
  db.collection("cards").orderBy("ts","desc").onSnapshot(s=>{ok=true;note("");cards=s.docs.map(d=>({...d.data(),id:d.id}));render();if(fh){clearTimeout(saveT);saveT=setTimeout(writeSnap,3000)}},()=>note("โหลดข้อมูลไม่สำเร็จ"));
 }catch{local=true;note("โหมดทดลอง: ข้อมูลจะไม่ถูกบันทึกร่วมกัน (ต้องเข้าสู่ระบบ claude.ai)")}
})();
</script></body></html>
